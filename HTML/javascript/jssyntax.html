<!DOCTYPE html>
<html>
    <body>
        <script>
            // console = browser's console
            // log()= display message in console    
            // "Hello World"= message to be displayed in console
            // ; = marks the end of a instruction

            console.log("Hello World");

            // display the student's name 
            console.log("My name is Kavya");

            // display the student's age
            console.log("My age is 19");

            // display the student's college name
            console.log("My college name is kiet College");

            let age = 19;
            console.log("My age is " + age);
            age = 50;
            console.log("My age is " + age);
            const name = "Kavya";
            console.log("My name is " + name);
            var college = "kiet College";
            console.log("My college name is " + college);
            let student = {
                name: "Kavya",
                age: 19,
                college: "kiet College",
                course: "B.Tech"
            };
            console.log("Student details:");
            console.log("Name: " + student.name);
            console.log("Age: " + student.age);
            console.log("College: " + student.college);
            console.log("Course: " + student.course);

            let fruits = ["Apple", "Banana", "Mango", "Orange"];
            // display complete array
            console.log("Fruits: " + fruits);

            //array position starts from 0
            // 0 = Apple
            // 1 = Banana   
            // 2 = Mango
            // 3 = Orange
            console.log("First fruit: " + fruits[0]);
            console.log("Second fruit: " + fruits[1]);
            console.log("Third fruit: " + fruits[2]);
            console.log("Fourth fruit: " + fruits[3]);
        </script>
        hello world 
        i am learning javascript

        
    </body>
</html>
