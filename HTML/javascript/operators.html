<!DOCTYPE html>
    <body>
        <script>

            let age= 20;
            // == checks the value
            console.log(age==20); // true

            // === checks the value and type
            console.log(age===20); // true

            // != "not equal"
            console.log(age!=56); // true

            // !== "not equal value or not equal type"
            console.log(age!==20); // false

            // > greater than
            console.log(age>10); // true

            // < less than
            console.log(age<30); // true

            // >= greater than or equal to
            console.log(age>=20); // true

            // <= less than or equal to
            console.log(age<=30); // true

            let marks = 80;
            // logical AND (&&)
            // both conditions must be true for the result to be true

            console.log(marks>50 && marks<100); // true
            // logical OR (||)
            // either condition can be true for the result to be true

            console.log(marks>90 || marks>=100); // false

            // ! logical NOT
            // it changes true to false and false to true
            console.log(!(marks>50)); // false



        </script>
